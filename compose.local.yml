name: webdev-coursework-local
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: webdev_coursework_local
      POSTGRES_USER: webdev_local
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:?Run configure-local-owner first}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webdev_local -d webdev_coursework_local"]
      interval: 3s
      timeout: 3s
      retries: 15
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction", "--requirepass", "${LOCAL_REDIS_PASSWORD:?Run configure-local-owner first}"]
    ports:
      - "127.0.0.1:56379:6379"
    volumes:
      - redis_data:/data
volumes:
  postgres_data:
  redis_data:
