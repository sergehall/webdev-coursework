# .github/workflows/frontend-common.yml
name: Frontend Common Workflow

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      run_lint:
        required: true
        type: boolean
      run_tests:
        required: true
        type: boolean
      run_build:
        required: true
        type: boolean
    secrets:
      VITE_API_URL:
        required: true
      VITE_QUIZ_SECRET:
        required: true
      VITE_SENTRY_DSN:
        required: true
      ACTIONS_CHECKOUT_TOKEN:
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./frontend
    env:
      VITE_ENVIRONMENT: ${{ inputs.environment }}
      VITE_API_URL: ${{ secrets.VITE_API_URL }}
      VITE_QUIZ_SECRET: ${{ secrets.VITE_QUIZ_SECRET }}
      VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ACTIONS_CHECKOUT_TOKEN != '' && secrets.ACTIONS_CHECKOUT_TOKEN || github.token }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack + Yarn (Berry)
        run: |
          corepack enable
          corepack prepare yarn@4.14.1 --activate
          yarn -v

      - name: Cache Yarn
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/yarn
            .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install deps
        run: yarn install --immutable

      - name: Lint
        if: inputs.run_lint
        run: yarn lint

      - name: Tests
        if: inputs.run_tests
        run: yarn test:run

      - name: Build
        if: inputs.run_build
        run: |
          echo "VITE_ENVIRONMENT=$VITE_ENVIRONMENT" >> .env
          echo "VITE_API_URL=$VITE_API_URL" >> .env
          echo "VITE_QUIZ_SECRET=$VITE_QUIZ_SECRET" >> .env
          echo "VITE_SENTRY_DSN=$VITE_SENTRY_DSN" >> .env
          yarn build
